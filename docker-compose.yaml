services:
  backend:
    env_file:
      - .env
    build:
      context: .
    image: inventory_backend
    ports:
      - "8080:8080"
    depends_on:
      liquibase:
        condition: service_completed_successfully
    networks:
      - backend_net
  db:
    image: postgres:latest
    container_name: Storage_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - dbv:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - backend_net

  liquibase:
    image: liquibase:4.30.0
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src/main/resources/db/changelog:/liquibase/changelog:ro
    working_dir: /liquibase/changelog
    command:
      - --changeLogFile=db.changelog-master.yaml
      - --url=${DB_URL}
      - --username=${DB_USER}
      - --password=${DB_PASS}
      - update
    networks:
      - backend_net


networks:
  backend_net:
    driver: bridge

volumes:
  dbv: